<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reading List</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #121212;
        color: #e4e4e7;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 2rem 1rem;
      }
      h1 {
        margin-top: 0;
        margin-bottom: 0.25rem;
      }
      .stats {
        margin: 0 0 1.5rem;
        color: #a1a1aa;
        font-size: 0.875rem;
      }
      form {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-bottom: 1.5rem;
      }
      input {
        flex: 1 1 140px;
        min-width: 0;
        padding: 0.5rem 0.75rem;
        background: #1e1e22;
        color: inherit;
        border: 1px solid #333;
        border-radius: 6px;
        font: inherit;
      }
      button {
        padding: 0.5rem 0.9rem;
        background: #3b82f6;
        color: #fff;
        border: 0;
        border-radius: 6px;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        background: #2563eb;
      }
      button.ghost {
        background: transparent;
        color: #a1a1aa;
        border: 1px solid #333;
        padding: 0.25rem 0.6rem;
      }
      button.ghost:hover {
        background: #26262b;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      li {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem;
        background: #1e1e22;
        border-radius: 6px;
        margin-bottom: 0.5rem;
      }
      .info {
        flex: 1;
        min-width: 0;
      }
      .author {
        color: #a1a1aa;
        font-size: 0.875rem;
      }
      li.read .title {
        text-decoration: line-through;
        color: #71717a;
      }
      .empty {
        color: #71717a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Reading List</h1>
      <p id="stats" class="stats" hidden></p>
      <form id="form">
        <input id="title" placeholder="Title" required />
        <input id="author" placeholder="Author" />
        <button>Add</button>
      </form>
      <ul id="list"></ul>
      <p id="empty" class="empty" hidden>No books yet.</p>
    </main>
    <script>
      const list = document.getElementById("list");
      const empty = document.getElementById("empty");

      async function api(path, options) {
        const res = await fetch(path, options);
        if (!res.ok) throw new Error((await res.json()).error);
        return res.status === 204 ? null : res.json();
      }

      function render(books) {
        list.replaceChildren(
          ...books.map((book) => {
            const li = document.createElement("li");
            li.className = book.read ? "read" : "";

            const info = document.createElement("div");
            info.className = "info";
            const title = document.createElement("div");
            title.className = "title";
            title.textContent = book.title;
            const author = document.createElement("div");
            author.className = "author";
            author.textContent = book.author;
            info.append(title, author);

            const toggle = document.createElement("button");
            toggle.className = "ghost";
            toggle.textContent = book.read ? "Unread" : "Mark read";
            toggle.onclick = () =>
              change(`/api/books/${book.id}`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ read: !book.read }),
              });

            const del = document.createElement("button");
            del.className = "ghost";
            del.textContent = "Delete";
            del.onclick = () =>
              change(`/api/books/${book.id}`, { method: "DELETE" });

            li.append(info, toggle, del);
            return li;
          }),
        );
        empty.hidden = books.length > 0;
      }

      const stats = document.getElementById("stats");

      function renderStats({ total, read }) {
        stats.textContent = `${read} of ${total} read`;
        stats.hidden = false;
      }

      async function refresh() {
        const [books, counts] = await Promise.allSettled([
          api("/api/books"),
          api("/api/stats"),
        ]);
        if (books.status === "rejected") throw books.reason;
        render(books.value);
        if (counts.status === "fulfilled") renderStats(counts.value);
        else stats.hidden = true;
      }
      async function change(path, options) {
        try {
          await api(path, options);
          await refresh();
        } catch (err) {
          alert(err.message);
        }
      }

      document.getElementById("form").onsubmit = async (e) => {
        e.preventDefault();
        const title = document.getElementById("title");
        const author = document.getElementById("author");
        await change("/api/books", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title: title.value, author: author.value }),
        });
        e.target.reset();
        title.focus();
      };

      refresh().catch((err) => alert(err.message));
    </script>
  </body>
</html>
